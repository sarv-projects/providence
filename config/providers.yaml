# Provider catalog — OpenCode Zen FREE is the DEFAULT primary.
# Empty base_url → https://opencode.ai/zen/v1  (POST /chat/completions)
# Empty api_key_env → no Authorization header
#
# Free IDs are DISCOVERED LIVE at runtime via GET /zen/v1/models (no key)
# and merged/validated against this list — stale IDs are dropped and new
# ones auto-added. Set PROVIDENCE_DISABLE_MODEL_DISCOVERY=1 to skip.
# YAML list below is the offline fallback only (verified 2026-08-31).
# Deprecated by provider (401 "not supported"): hy3-free,
#   longcat-2.0-free, north-mini-code-free

providers:
  # ── OpenCode Zen free (always available, no key) ──
  opencode_free:
    name: "OpenCode Zen (Free)"
    base_url: ""
    api_key_env: ""
    default: true
    models:
      - nemotron-3-ultra-free         # live 200 no-key, clean JSON
      - nemotron-3.5-lightning-free   # live 200 no-key
      - mimo-v2.5-free                # documented free; may 429
      - big-pickle                    # live free (reasoning)
      - muse-spark-1.2-contributor-free  # live free (Responses API /v1/responses)
      - muse-spark-1.3-contributor-free  # live free (Responses API /v1/responses)
      - ling-3.0-flash-fin-free          # live free
      # NOTE: deepseek-v4-flash-free removed — listed on /models but
      # completions fail; filtered at runtime by DEAD_MODEL_PATTERNS too.
      # NOTE: laguna-s-2.1-free removed — absent from the official free list,
      # consistent 503; also in DEAD_MODEL_PATTERNS.
      # NOTE: deepseek-v4-flash-free removed — listed on /models but
      # completions fail; filtered at runtime by DEAD_MODEL_PATTERNS too.

  # ── Groq (https://console.groq.com/docs/openai · /docs/models) ──
  # OpenAI-compatible base: https://api.groq.com/openai/v1
  # Env: GROQ_API_KEY=gsk_...
  # List: GET https://api.groq.com/openai/v1/models
  # Chat: POST https://api.groq.com/openai/v1/chat/completions
  groq:
    name: "Groq"
    # catalog appends /v1 if missing → effective https://api.groq.com/openai/v1
    base_url: "https://api.groq.com/openai"
    api_key_env: "GROQ_API_KEY"
    models:
      # Live chat IDs verified against /v1/models with this account
      - llama-3.1-8b-instant              # fast / cheap
      - openai/gpt-oss-20b                # solid workhorse
      - llama-3.3-70b-versatile           # strong quality
      - openai/gpt-oss-120b               # strongest text
      - qwen/qwen3.6-27b                  # reasoning-capable
      - allam-2-7b
      - groq/compound                     # agentic compound system
      - groq/compound-mini

  # ── OpenRouter (https://openrouter.ai/docs) ──
  # Base: https://openrouter.ai/api/v1  Key: OPENROUTER_API_KEY
  # Free models use :free suffix
  openrouter:
    name: "OpenRouter"
    base_url: "https://openrouter.ai/api"
    api_key_env: "OPENROUTER_API_KEY"
    models:
      - openrouter/free
      - cohere/north-mini-code:free
      - nvidia/nemotron-3-ultra-550b-a55b:free
      - nvidia/nemotron-3-super-120b-a12b:free
      - poolside/laguna-s-2.1:free
      - xiaomi/mimo-v2.5
      - deepseek/deepseek-chat
      - meta-llama/llama-3.3-70b-instruct

  # ── NVIDIA NIM (https://docs.api.nvidia.com / build.nvidia.com) ──
  # Base: https://integrate.api.nvidia.com/v1  Key: NVIDIA_API_KEY
  # List: GET /v1/models
  nvidia_nim:
    name: "NVIDIA NIM"
    base_url: "https://integrate.api.nvidia.com"
    api_key_env: "NVIDIA_API_KEY"
    models:
      - meta/llama-3.1-70b-instruct
      - meta/llama-3.1-8b-instruct
      - meta/llama-3.3-70b-instruct
      - deepseek-ai/deepseek-v4-flash-0731
      - google/gemma-3-12b-it
      - google/gemma-3-4b-it
      - mistralai/mistral-large-2-instruct
      - mistralai/mixtral-8x22b-instruct-v0.1
      - nvidia/llama-3.1-nemotron-70b-instruct
      - qwen/qwen2.5-coder-32b-instruct

  # ── Google Gemini ──
  gemini:
    name: "Gemini (Google)"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: "GEMINI_API_KEY"
    models:
      - gemini-3.5-flash-lite
      - gemini-3.1-flash-lite
      - gemini-3.6-flash
      - gemini-2.5-flash

  # ── OpenAI ──
  openai:
    name: "OpenAI"
    base_url: "https://api.openai.com"
    api_key_env: "OPENAI_API_KEY"
    models:
      - gpt-4o-mini
      - gpt-4o
      - gpt-4.1-mini

  # ── Anthropic Claude ──
  claude:
    name: "Claude (Anthropic)"
    base_url: "https://api.anthropic.com"
    api_key_env: "ANTHROPIC_API_KEY"
    protocol: "anthropic_messages"
    models:
      - claude-sonnet-4-5
      - claude-haiku-4-5

  # ── DeepSeek ──
  deepseek:
    name: "DeepSeek"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    models:
      - deepseek-v4-flash            # live 2026-08-31 via GET /models
      - deepseek-v4-pro              # live 2026-08-31
      - deepseek-v4-flash-vision-exp # live 2026-08-31

  # ── Cohere ──
  cohere:
    name: "Cohere Platform"
    base_url: "https://api.cohere.com"
    api_key_env: "CO_API_KEY"
    protocol: "cohere_v2_chat"
    models:
      - command-a-03-2025
      - command-r-plus

# ── Tiers ──
# DEFAULT: OpenCode Zen free (no key). Paid keys are last-resort failover only.
# Do not put Groq/OpenAI first even when those keys exist.
tiers:
  # Workhorse: OpenCode Zen free. Thinker: Gemini only (ARCHITECTURE / SPEC).
  fast:
    - provider: opencode_free
      model: nemotron-3-ultra-free
    - provider: opencode_free
      model: nemotron-3.5-lightning-free
    - provider: opencode_free
      model: mimo-v2.5-free
    - provider: opencode_free
      model: muse-spark-1.3-contributor-free

  strong:
    - provider: opencode_free
      model: nemotron-3-ultra-free
    - provider: opencode_free
      model: muse-spark-1.3-contributor-free
    - provider: opencode_free
      model: big-pickle
    - provider: opencode_free
      model: nemotron-3.5-lightning-free

  thinker:
    - provider: gemini
      model: gemini-3.5-flash-lite
    - provider: gemini
      model: gemini-3.1-flash-lite
    - provider: gemini
      model: gemini-3.6-flash
    - provider: gemini
      model: gemini-2.5-flash
